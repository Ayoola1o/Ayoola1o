<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Vibrant Primary Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- Futuristic Geometric 'A' / Code Apex Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Outer Apex Shield / Letter A Peak -->
    <path d="M 64 24 L 98 94 L 81 94 L 64 56 L 47 94 L 30 94 Z" fill="url(#accentGrad)" />

    <!-- Sleek Tech Crossbar -->
    <path d="M 44 72 L 84 72" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

    <!-- Center Pulse Core -->
    <circle cx="64" cy="42" r="3.5" fill="#ffffff" />
  </g>
</svg>
